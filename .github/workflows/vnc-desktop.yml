name: Smooth Android via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  android-vnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm $USER

      - name: Start High-Performance Android Container
        run: |
          docker run -d \
            --name android-container \
            --privileged \
            --device /dev/kvm \
            -p 6080:6080 \
            -p 5555:5555 \
            -e WEB_VNC=true \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            -e APPIUM=false \
            -e AUDIO_DISABLE=true \
            budtmo/docker-android:emulator_11.0

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Expose Android via Cloudflare Tunnel
        run: |
          echo "===================================================="
          echo "Your Smooth Android web desktop is available at the URL below:"
          echo "===================================================="
          cloudflared tunnel --url http://127.0.0.1:6080 &
          
          # Keep the workflow alive for 2 hours
          sleep 7200
