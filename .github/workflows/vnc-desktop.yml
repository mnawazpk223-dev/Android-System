name: Android Desktop via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  android-vnc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Android Container
        run: |
          docker run -d \
            --name android-container \
            --privileged \
            --device /dev/kvm \
            -p 6080:6080 \
            -p 5555:5555 \
            -e WEB_VNC=true \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            budtmo/docker-android:emulator_11.0

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Expose Android via Cloudflare Tunnel
        run: |
          echo "===================================================="
          echo "Your Android web desktop is available at the URL below:"
          echo "===================================================="
          cloudflared tunnel --url http://127.0.0.1:6080 &
          
          # Keep the workflow alive for 2 hours
          sleep 7200
