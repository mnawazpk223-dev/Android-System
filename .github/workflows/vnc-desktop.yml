name: VNC Desktop Environment

on:
  workflow_dispatch:

jobs:
  vnc_desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Desktop VNC Container
        run: |
          docker run -d \
            --name android-vnc-container \
            -p 5900:5900 \
            -p 6080:6080 \
            dorowu/ubuntu-desktop-lxde-vnc

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Expose VNC via Cloudflare Tunnel
        run: |
          echo "===================================================="
          echo "Your VNC web desktop is available at the URL below:"
          echo "===================================================="
          cloudflared tunnel --url http://localhost:6080 &
          
          # Keep workflow alive for 2 hours
          sleep 7200
