name: VNC Desktop Environment

on:
  workflow_dispatch:

jobs:
  vnc_desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Desktop VNC Container
        run: |
          docker run -d \
            --name android-vnc-container \
            -p 5900:5900 \
            -p 6080:6080 \
            dorowu/ubuntu-desktop-lxde-vnc

      - name: Expose via Pinggy
        run: |
          echo "Starting Pinggy tunnel..."
          curl -p https://pinggy.io/link?port=6080
          
          # Keep workflow alive for 2 hours
          sleep 7200
