name: VNC Desktop Environment

on:
  workflow_dispatch:

jobs:
  vnc_desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Desktop VNC Container
        run: |
          docker run -d \
            --name android-vnc-container \
            -p 5900:5900 \
            -p 6080:6080 \
            dorowu/ubuntu-desktop-lxde-vnc

      - name: Expose via Pinggy SSH Tunnel
        run: |
          echo "Starting Pinggy Tunnel..."
          # This establishes a background SSH tunnel to pinggy.io for port 6080
          ssh -o StrictHostKeyChecking=no -R 0:localhost:6080 a.pinggy.io &
          
          # Wait a few seconds for the tunnel to initialize and print the public URL
          sleep 5
          
          # Keep workflow alive for 2 hours
          sleep 7200
